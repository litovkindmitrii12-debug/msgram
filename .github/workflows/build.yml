name: Build msgram for Windows

# Run it by hand: GitHub -> Actions -> "Build msgram for Windows" -> Run workflow.
# The first run builds Qt and all libraries from source (2-4 hours, free for
# public repositories). They are cached, so every next build is much faster.
# If the first run hits the 6 hour limit, just press "Re-run" - the cache of
# the finished steps is reused.
on:
  workflow_dispatch:
    inputs:
      only_cache:
        description: "Only build and cache the libraries (no msgram.exe)"
        type: boolean
        default: false
  push:
    branches: [ main, master ]
    paths:
      - 'Telegram/**'
      - '.github/workflows/msgram-win.yml'

jobs:
  windows:
    name: msgram.exe (x64, Qt 6, Release)
    runs-on: windows-latest
    timeout-minutes: 360
    env:
      PREPARE_PATH: "Telegram/build/prepare/prepare.py"
    defaults:
      run:
        shell: cmd

    steps:
      - name: Prepare directories.
        run: |
          mkdir %userprofile%\TBuild\Libraries
          mklink /d %GITHUB_WORKSPACE%\TBuild %userprofile%\TBuild
          echo TBUILD=%GITHUB_WORKSPACE%\TBuild>>%GITHUB_ENV%
          echo LibrariesPath=%GITHUB_WORKSPACE%\TBuild\Libraries\win64>>%GITHUB_ENV%

      - name: Get repository name.
        shell: bash
        run: echo "REPO_NAME=${GITHUB_REPOSITORY##*/}" >> $GITHUB_ENV

      - name: Clone.
        uses: actions/checkout@v4
        with:
          path: ${{ env.TBUILD }}\${{ env.REPO_NAME }}

      # The source archive has no git submodules (lib_ui, lib_base, ...).
      # Take them from the official repository.
      - name: Fetch missing submodules.
        shell: bash
        run: |
          cd "$TBUILD/$REPO_NAME"
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/telegramdesktop/tdesktop.git "$TBUILD/upstream"
          grep 'path = ' .gitmodules | sed 's/.*path = //' | while read -r p; do
            if [ -z "$(ls -A "$p" 2>/dev/null)" ]; then
              mkdir -p "$p"
              cp -r "$TBUILD/upstream/$p/." "$p/"
            fi
          done

      - name: First set up.
        shell: bash
        run: |
          DOCPATH=$TBUILD/$REPO_NAME/docs/building-win.md
          SDK="$(grep "SDK version" $DOCPATH | sed -r 's/.*\*\*(.*)\*\* SDK version.*/\1/')"
          echo "SDK=$SDK" >> $GITHUB_ENV

          sed -i '/CMAKE_${lang}_FLAGS_DEBUG_INIT/s/${_Zi}//' "$PROGRAMFILES"/CMake/share/cmake*/Modules/Platform/Windows-MSVC.cmake

          echo "$(sha256sum $TBUILD/$REPO_NAME/$PREPARE_PATH | awk '{ print $1 }')" >> CACHE_KEY.txt
          echo "$SDK" >> CACHE_KEY.txt
          echo "CACHE_KEY=$(sha256sum CACHE_KEY.txt | awk '{ print $1 }')" >> $GITHUB_ENV

          git config --global user.email "msgram@example.com"
          git config --global user.name "msgram"

      - uses: Eden-CI/msvc-dev-cmd@master
        name: Native Tools Command Prompt.
        with:
          arch: x64
          sdk: ${{ env.SDK }}
          toolset: '14.44'

      - name: NuGet sources.
        run: |
          nuget sources Disable -Name "Microsoft Visual Studio Offline Packages"
          nuget sources Add -Source https://api.nuget.org/v3/index.json & exit 0

      - name: ThirdParty cache.
        uses: actions/cache@v4
        with:
          path: ${{ env.TBUILD }}\ThirdParty
          key: ${{ runner.OS }}-third-party-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-third-party-

      - name: Libraries cache.
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\*
            !${{ env.LibrariesPath }}\cache_keys
            !${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\*
            !${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-libs-release-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-libs-release-

      - name: Qt cache.
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.LibrariesPath }}\[qQ]t[_-]*
            ${{ env.LibrariesPath }}\cache_keys\[qQ]t[_-]*
          key: ${{ runner.OS }}-qt6-release-${{ env.CACHE_KEY }}
          restore-keys: ${{ runner.OS }}-qt6-release-

      - name: Libraries.
        run: |
          %TBUILD%\%REPO_NAME%\Telegram\build\prepare\win.bat silent qt6

      - name: Free up some disk space.
        shell: bash
        run: find $LibrariesPath '(' '(' ! '(' -name '*.lib' -o -name '*.a' -o -name '*.exe' -o -name '*.h' -o -name '*.hpp' -o -name '*.inc' -o -name '*.cmake' -o -name '*.pc' -o -path '*/include/*' -o -path '*/objects-*' -o -path '*/cache_keys/*' -o -path '*/patches/*' -o -path '*/nv-codec-headers/*' ')' -type f ')' -o -empty ')' -delete

      - name: msgram build.
        if: ${{ !inputs.only_cache }}
        run: |
          cd %TBUILD%\%REPO_NAME%\Telegram

          call configure.bat ^
          x64 ^
          qt6 ^
          -D TDESKTOP_API_TEST=ON ^
          -D CMAKE_CONFIGURATION_TYPES=Release ^
          -D DESKTOP_APP_DISABLE_AUTOUPDATE=ON ^
          -D DESKTOP_APP_DISABLE_CRASH_REPORTS=ON

          cmake --build ..\out --config Release --parallel

      - name: Collect msgram.exe.
        if: ${{ !inputs.only_cache }}
        shell: bash
        run: |
          mkdir -p artifact
          cp "$TBUILD/$REPO_NAME/out/Release/msgram.exe" artifact/
          echo "127.0.0.1:10443" > artifact/msgram_server.txt

      - uses: actions/upload-artifact@v4
        name: Upload msgram.exe.
        if: ${{ !inputs.only_cache }}
        with:
          name: msgram-windows-x64
          path: artifact\
          retention-days: 30
